[package]
name = "muzon-services"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0"
description = "S3 and scrobbling adapters without a windowing runtime"
[dependencies]
muzon-core = {path="../muzon-core"}
serde = {version="1",features=["derive"]}
serde_json = "1"
specta = {version="2.0.0-rc.25",features=["derive"]}
anyhow = "1"
reqwest = {version="0.13",default-features=false,features=["json","query","form","rustls","rustls-native-certs","stream"]}
tokio = {version="1",features=["sync","time","rt","macros","fs","io-util"]}
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
md-5 = "0.10"
zeroize = "1"
url = "2"
tokio-util = {version="0.7",features=["io","rt"]}
[dev-dependencies]
muzon-core = {path="../muzon-core",features=["test-support"]}

[package]
name = "muzon"
version = "0.1.0"
description = "Muzon music player"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "muzon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["sync"] }

gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-audio = "0.25"
gstreamer-pbutils = "0.25"

rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"

lofty = "0.22"
walkdir = "2"
base64 = "0.22"
mpris-server = { version = "0.10.0", features = ["tokio"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"

